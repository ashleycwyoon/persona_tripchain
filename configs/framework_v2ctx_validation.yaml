# Context run (scripts/run_v2ctx.sh): v2 validation with the processed_v2ctx demographics and the v2ctx SFT adapters.
# v2 data (scripts/rebuild_ground_truth_v2.py, 70/10/20 split) and v2 SFT adapters.
# Evaluation on the v2 validation split.
paths:
  # Files under ${DATA_HOME}/tripchain_1015 are written by the upstream preprocessing (see README).
  test_demographics: ${DATA_ROOT}/processed_v2ctx/validation/demographics_with_residence.jsonl
  location_whitelist: ${DATA_HOME}/tripchain_1015/processed/ktdb_location_whitelist.json
  student1_adapter: ${OUTPUT_ROOT}/runs/student1_v2ctx_sft/final
  student2_adapter: ${OUTPUT_ROOT}/runs/student2_v2ctx_sft/final
  model_cache: ${HF_HUB_CACHE}
  ground_truth_reference: ${DATA_ROOT}/processed_v2/validation/ground_truth_tripmode.jsonl
  location_lookup_source: ${DATA_HOME}/tripchain_1015/processed/train/location_dwell_mode_preference.jsonl
  indexed_poi_catalog: ${DATA_HOME}/tripchain_1015/processed/testing/seoul_poi_catalog_by_admin_dong.parquet
  poi_category_map: configs/poi_category_map.yaml
  student1_predictions: ${OUTPUT_ROOT}/student1_predictions.jsonl
  student2_predictions: ${OUTPUT_ROOT}/student2_predictions.jsonl
  rollout_output: ${OUTPUT_ROOT}/rollouts.jsonl

inference:
  base_model: Qwen/Qwen3.5-2B
  batch_size: 1
  student1_max_new_tokens: 800
  student2_max_new_tokens: 1200
  temperature: 0.7
  top_p: 0.9
  max_retries: 2
  retry_temperature: 0.2
  seed: 42
  # Must match how the Student adapters were trained (tripchain/common.py OUTPUT_ORDERS).
  output_order: reason_first_tripmode
  # Student2 validation failure: resample the unchanged prompt at `temperature`.
  student2_resample_attempts: 4
  # Still failing: regenerate Student1 then Student2 (scripts/repair_student2_failures.py).
  student1_repair_rounds: 2

poi_sampling:
  master_pool_size: 50
  active_pool_size: 5
  seed: 2021
  min_official_match_confidence: 0.80

graphhopper:
  base_url: http://localhost:8989
  # Freeze to a date represented by the installed GTFS for reproducibility.
  service_date: "2026-08-06"
  timezone_offset: "+09:00"
  timeout_sec: 30
  max_cache_entries: 20000
  modes: [walk, bike, bus, subway, car]
  bike_walk_speedup: 3.0

scheduling:
  day_minutes: 1440
  day_origin_hour: 3
  # The last stay (any activity type) is the rest of the day (1440 - arrival), not a predicted dwell.
  final_home_residual: true

activity_constraints:
  require_start_home: true
  # Off: 3.7% of ground-truth days end away from home (e.g. at work);
  # the final stay of any type runs to the end of the day (final_home_residual).
  require_end_home: false

optimization:
  max_states_per_signature: 48
  max_total_states: 4096
  selection_temperature: 0.35
  selection_seed: 1030
  diversity_time_bucket_min: 30
  preference_weight: 1.0
  distance_weight: 0.02
  transfer_weight: 0.10
  waiting_weight: 0.02
  exact_candidate_attempts: 8
  # A leg whose Student2 mode cannot be routed falls back to the ranked search at this cost.
  mode_fallback_penalty: 2.0

rewards:
  weights:
    activity: 1.0
    location: 1.0
    dwell: 1.0
    # One main mode per trip (tripchain/trip_modes.py); replaces the person-level ranking.
    trip_mode: 0.5
    feasibility: 1.5
    # Realized start of each activity vs this person's GT start (rewards.start_time_reward).
    start_time: 1.0
  dwell_tolerance_min: 120.0
  start_time_tolerance_min: 60.0
  future_discount: 0.95
  feasibility:
    bonus: 1.0
    time_per_minute: 0.01
    route_per_leg: 0.5
    # Unroutable Student2 modes as a share of the day's legs (1.0 = every leg);
    # a per-leg count penalized long days. tripchain/rewards.py feasibility_reward.
    mode_share_penalty: 1.0
    activity_per_violation: 0.5


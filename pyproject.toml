[project]
name = "personatc"
version = "0.1.0"
description = "Persona-conditioned Seoul trip-chain generation: two Student LLMs, a routing environment and dense-reward GRPO fine-tuning"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "pyyaml>=6.0",
  "tqdm>=4.65",
  "matplotlib>=3.7",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]
# Student SFT, inference and GRPO.
train = [
  "torch>=2.1",
  "transformers>=4.40",
  "peft>=0.10",
  "trl>=0.8",
  "datasets>=2.18",
  "accelerate>=0.27",
  "bitsandbytes",
]
# Teacher labelling (Qwen2.5-32B-Instruct-AWQ served by vLLM).
teacher = ["vllm"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tripchain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
# Vendored upstream code is kept byte-identical to its source.
extend-exclude = ["third_party"]

[tool.ruff.lint]
# Pyflakes and the pycodestyle error classes, stated explicitly so the result
# does not depend on the installed ruff version's defaults.
select = ["E4", "E7", "E9", "F"]
# Small lambdas bound to a local name are used on purpose.
ignore = ["E731"]
